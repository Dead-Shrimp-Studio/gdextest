[gdextest]
version = "1"
minimum_required_godot_version = "4.5"

[gdextest.tests]
sources = ["tests/**/*.cpp"]

[gdextest.test]
timeout_ms = 30000
isolate_timeout_sec = 60
flaky_retries = 3

[gdextest.host]
mode = "editor"
entry_symbol = "gdextest_library_init"
plugin_class = "GdextestPlugin"

[gdextest.fixture]
directory = "build/gdextest/project"
project_name = "gdextest fixture"
native_extensions = []
assets = []
scan_timeout_ms = 20000

[gdextest.output]
directory = "bin"
name = "libgdextest"

[gdextest.build]
args = []
